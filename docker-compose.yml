services:
  client:
    build:
      context: .
      dockerfile: client/dockerfile
    ports:
      - '8080:80'
    depends_on:
      - server
    restart: unless-stopped

  migrate:
    build:
      context: ./server
      dockerfile: dockerfile
      target: builder
    env_file:
      - ./server/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@db:5432/flow_board
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: ./server
      dockerfile: dockerfile
    env_file:
      - ./server/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flow_board
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
